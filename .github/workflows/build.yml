name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # The GCC archives are cached by their pinned sha256, so a Launchpad outage does not fail CI.
      - name: Read the pinned toolchain hashes
        id: toolchains
        run: |
          gcc48=$(sed -n 's/^ARG GCC48_SHA256=//p' Dockerfile)
          gcc49=$(sed -n 's/^ARG GCC49_SHA256=//p' Dockerfile)
          echo "key=toolchains-$gcc48-$gcc49" >> "$GITHUB_OUTPUT"

      - name: Restore the toolchain archives
        id: restore-toolchains
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .toolchains
          key: ${{ steps.toolchains.outputs.key }}

      - name: Download the toolchain archives
        if: steps.restore-toolchains.outputs.cache-hit != 'true'
        run: |
          mkdir -p .toolchains
          for name in GCC48 GCC49; do
            url=$(sed -n "s/^ARG ${name}_URL=//p" Dockerfile)
            sha=$(sed -n "s/^ARG ${name}_SHA256=//p" Dockerfile)
            curl -fsSL --retry 10 --retry-all-errors --retry-delay 30 --connect-timeout 30 --max-time 900 \
              -o ".toolchains/$name.tar.bz2" "$url"
            echo "$sha  .toolchains/$name.tar.bz2" | sha256sum -c -
          done

      - name: Save the toolchain archives
        if: steps.restore-toolchains.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .toolchains
          key: ${{ steps.toolchains.outputs.key }}

      - name: Build the image
        run: |
          ./mutable image --build-arg GCC48_LOCAL=.toolchains/GCC48.tar.bz2 \
            --build-arg GCC49_LOCAL=.toolchains/GCC49.tar.bz2

      - name: Clone the eurorack code
        run: ./mutable clone

      # Before the builds, which can regenerate resources.cc.
      - name: Host render tests
        run: ./mutable render

      - name: Build every module and bootloader
        run: |
          failed=0
          cd eurorack-modules
          for mf in */makefile */bootloader/makefile; do
            if ../mutable make -f "$mf" > build.log 2>&1; then
              echo "ok   $mf"
            else
              echo "FAIL $mf"; tail -20 build.log; failed=1
            fi
          done
          exit $failed

      - name: Build the update files
        run: |
          failed=0
          cd eurorack-modules
          for mf in */makefile; do
            target=$(sed -n 's/^\(wav\|syx\) *:.*/\1/p' "$mf" | head -1)
            [ -n "$target" ] || continue
            if ../mutable make -f "$mf" "$target" > build.log 2>&1; then
              echo "ok   $mf $target"
            else
              echo "FAIL $mf $target"; tail -20 build.log; failed=1
            fi
          done
          exit $failed

      - name: Reproduce Mutable Instruments' releases
        run: ./mutable check-releases

      - name: Compiler matrix smoke test
        run: |
          ./mutable compilers --compiler 14.3.Rel1
          ./mutable matrix --compiler 14.3.Rel1 --no-werror --csv matrix.csv peaks plaits
          grep -q '^14.3.Rel1,peaks,ok,' matrix.csv
          grep -q '^14.3.Rel1,plaits,ok,' matrix.csv
