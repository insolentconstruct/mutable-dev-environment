name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Build the image
        run: ./mutable image

      - name: Clone the eurorack code
        run: ./mutable clone

      # Before the builds, which can regenerate resources.cc.
      - name: Host render tests
        run: ./mutable render

      - name: Build every module and bootloader
        run: |
          failed=0
          cd eurorack-modules
          for mf in */makefile */bootloader/makefile; do
            if ../mutable make -f "$mf" > build.log 2>&1; then
              echo "ok   $mf"
            else
              echo "FAIL $mf"; tail -20 build.log; failed=1
            fi
          done
          exit $failed

      - name: Build the update files
        run: |
          failed=0
          cd eurorack-modules
          for mf in */makefile; do
            target=$(sed -n 's/^\(wav\|syx\) *:.*/\1/p' "$mf" | head -1)
            [ -n "$target" ] || continue
            if ../mutable make -f "$mf" "$target" > build.log 2>&1; then
              echo "ok   $mf $target"
            else
              echo "FAIL $mf $target"; tail -20 build.log; failed=1
            fi
          done
          exit $failed

      - name: Reproduce Mutable Instruments' releases
        run: ./mutable check-releases

      - name: Compiler matrix smoke test
        run: |
          ./mutable compilers --compiler 14.3.Rel1
          ./mutable matrix --compiler 14.3.Rel1 --no-werror --csv matrix.csv peaks plaits
          grep -q '^14.3.Rel1,peaks,ok,' matrix.csv
          grep -q '^14.3.Rel1,plaits,ok,' matrix.csv
